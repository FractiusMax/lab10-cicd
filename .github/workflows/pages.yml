# =============================================================================
#  CD: автоматическая публикация приложения на GitHub Pages.
#
#  Публикация выполняется ТОЛЬКО при успешном прохождении автотестов в ветке
#  main. Для этого workflow задан блок `needs: tests`: job `deploy` не
#  запустится, если job `tests` завершился с ошибкой.
#
#  Дополнительно в ветке main проверяется, что рабочее дерево совпадает с
#  веткой dev: dev — основная ветка разработки, в main попадает только
#  проверенный код.
# =============================================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикация не должна прерываться параллельными запусками
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Проверка тестов перед публикацией
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Установить Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Запустить автотесты
        run: python -m pytest

  deploy:
    name: Публикация на GitHub Pages
    # job не запустится, если тесты в ветке main не прошли
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить статический сервер
        uses: actions/configure-pages@v5

      - name: Выгрузить артефакт публикации
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
