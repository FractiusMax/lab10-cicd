[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers --durations=10
markers =
    ui: тесты пользовательского интерфейса (Selenium)
    smoke: быстрая проверка доступности основных сценариев
filterwarnings =
    ignore::DeprecationWarning
